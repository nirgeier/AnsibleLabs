# docker-compose.prod.yml
# Production compose — pulls all pre-built images from GitHub Container Registry.
# No local build required.
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d

services:

  # ── Ansible controller + web terminal UI ─────────────────────────────────────
  ansible-labs:
    image: "ghcr.io/nirgeier/ansiblelabs:${IMAGE_TAG:-latest}"
    container_name: ansible-labs
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    volumes:
      - ssh-keys:/ssh-shared
    networks:
      - ansible-labs-net
    depends_on:
      - server-1
      - server-2
      - server-3

  # ── Linux target servers ──────────────────────────────────────────────────────
  server-1:
    image: "ghcr.io/nirgeier/ansiblelabs-server:${IMAGE_TAG:-latest}"
    container_name: ansible-server-1
    hostname: server-1
    restart: unless-stopped
    pull_policy: always
    volumes:
      - ssh-keys:/ssh-shared
    networks:
      ansible-labs-net:
        aliases:
          - server-1

  server-2:
    image: "ghcr.io/nirgeier/ansiblelabs-server:${IMAGE_TAG:-latest}"
    container_name: ansible-server-2
    hostname: server-2
    restart: unless-stopped
    pull_policy: always
    volumes:
      - ssh-keys:/ssh-shared
    networks:
      ansible-labs-net:
        aliases:
          - server-2

  server-3:
    image: "ghcr.io/nirgeier/ansiblelabs-server:${IMAGE_TAG:-latest}"
    container_name: ansible-server-3
    hostname: server-3
    restart: unless-stopped
    pull_policy: always
    volumes:
      - ssh-keys:/ssh-shared
    networks:
      ansible-labs-net:
        aliases:
          - server-3

volumes:
  ssh-keys:

networks:
  ansible-labs-net:
    driver: bridge
